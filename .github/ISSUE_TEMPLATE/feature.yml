name: Feature request
description: Propose a change that fits the roadmap.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is in preview. Features outside the current roadmap need a
        short design note and maintainer approval before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core
        - Pack
        - Docs
        - Tooling / CI
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This does not require a central server by default.
          required: true
        - label: This works on macOS and Windows.
          required: true
        - label: This does not add credentials or real user data to the repo.
          required: true
