[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loomsci_core"
version = "0.1.0"
description = "Minimal local-first substrate for one-owner apps."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "loomsci_core contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["Flask>=3.0,<4"]

[project.scripts]
loomsci-v0 = "loomsci_core.cli:main"

[project.urls]
Homepage = "https://github.com/jiyanjiang/loomsci_core"
Issues = "https://github.com/jiyanjiang/loomsci_core/issues"

[tool.setuptools]
packages = ["loomsci_core"]
