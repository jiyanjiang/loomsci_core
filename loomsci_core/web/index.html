<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoomSci Core</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <strong>LoomSci Core</strong>
    <span id="status" class="muted">loading</span>
  </header>

  <main>
    <section class="panel">
      <h2>新建内容</h2>
      <form id="create-form">
        <input id="title" placeholder="标题" required>
        <textarea id="body" placeholder="正文 / Markdown" rows="6" required></textarea>
        <input id="tags" placeholder="标签，逗号分隔">
        <input id="file" type="file" multiple>
        <div class="actions">
          <button type="submit">创建</button>
          <button type="button" id="backup">创建备份</button>
        </div>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input id="search" placeholder="搜索标题或正文">
        <button id="search-button" type="button">搜索</button>
        <button id="clear-search" type="button">清除</button>
      </div>
      <p id="empty" class="muted">暂无内容。先创建一条。</p>
      <div id="items"></div>
    </section>
  </main>

  <script>window.__LOOMSCI_TOKEN__ = "__TOKEN__";</script>
  <script src="/assets/app.js"></script>
</body>
</html>
