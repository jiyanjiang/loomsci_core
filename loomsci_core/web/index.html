<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoomSci Core</title>
  <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <a class="brand" id="brand" href="#/">
        <img id="brand-logo" class="brand-logo" alt="" hidden>
        <span id="brand-name">LoomSci Core</span>
      </a>
      <nav>
        <button data-view="content" data-i18n="navContent">内容</button>
        <button data-view="tags" data-i18n="navTags">标签</button>
        <button data-view="trash" data-i18n="navTrash">回收站</button>
        <button data-view="site" data-i18n="navSite">站点</button>
        <button data-view="tools" data-i18n="navTools">工具</button>
        <button data-view="version" data-i18n="navVersion">版本</button>
        <button data-view="settings" data-i18n="navSettings">设置</button>
      </nav>
      <div id="app-nav" class="app-nav"></div>
      <div class="rail-footer">
        <button id="lang-toggle" class="lang-toggle">EN</button>
        <span id="status" class="muted">loading</span>
        <span id="core-version" class="muted"></span>
      </div>
    </aside>

    <main class="workspace">
      <section class="center-panel">
        <section class="panel" id="compose-panel">
          <h2 data-i18n="newContent">新建内容</h2>
          <form id="create-form">
            <textarea id="body" placeholder="Markdown 正文；可直接粘贴图片" rows="8" required data-i18n-ph="bodyPlaceholder"></textarea>
            <input id="tags" placeholder="标签，逗号分隔" data-i18n-ph="tagsPlaceholder">
            <input id="file" type="file" multiple>
            <button type="button" id="paste-image" data-i18n="pasteImage">从剪贴板粘贴图片</button>
            <div id="pending-files" class="pending"></div>
            <div class="actions">
              <button type="submit" class="primary" data-i18n="publish">发布</button>
              <button type="button" id="backup" data-i18n="backup">创建备份</button>
            </div>
          </form>
          <p id="message" class="message" role="status"></p>
        </section>

        <section class="panel" id="list-view">
          <div class="toolbar">
            <input id="search" placeholder="搜索" data-i18n-ph="searchPlaceholder">
            <button id="search-button" type="button" data-i18n="search">搜索</button>
            <button id="clear-search" type="button" data-i18n="clear">清除</button>
          </div>
          <div id="tag-cloud" class="tag-cloud" aria-label="标签云"></div>
          <p id="empty" class="muted" data-i18n="empty">暂无内容。先写一段 Markdown。</p>
          <div id="items"></div>
          <div class="actions">
            <button id="load-more" type="button" data-i18n="loadMore" hidden>加载更多</button>
          </div>
        </section>

        <section class="panel item-view" id="item-view" hidden></section>

        <section class="panel" id="tags-view" hidden>
          <div class="page-head">
            <h2 data-i18n="tagsTitle">标签</h2>
            <button type="button" data-home data-i18n="backHome">返回主页</button>
          </div>
          <div class="toolbar">
            <input id="tag-search" placeholder="筛选标签" data-i18n-ph="tagSearch">
            <button type="button" id="tag-clear" data-i18n="clear">清除</button>
          </div>
          <div id="tag-list" class="tag-list"></div>
          <p id="tag-message" class="message"></p>
        </section>

        <section class="panel" id="trash-view" hidden>
          <div class="page-head">
            <h2 data-i18n="trashTitle">回收站</h2>
            <button type="button" data-home data-i18n="backHome">返回主页</button>
          </div>
          <p class="muted" data-i18n="trashHint">删除的内容会进入回收站，可恢复，或手动彻底删除。</p>
          <div id="trash-list" class="trash-list"></div>
          <p id="trash-message" class="message"></p>
        </section>

        <section class="panel" id="tools-view" hidden>
          <div class="page-head">
            <h2 data-i18n="toolsTitle">工具</h2>
            <button type="button" data-home data-i18n="backHome">返回主页</button>
          </div>
          <p class="muted" data-i18n="toolsHint">输入 catalog JSON 地址或本地路径，检测可安装工具。</p>
          <form id="catalog-form">
            <label><span data-i18n="catalogSource">Catalog 地址或路径</span><input id="catalog-source" placeholder="https://.../catalog.json"></label>
            <div class="actions"><button type="submit" class="primary" data-i18n="detect">检测</button></div>
          </form>
          <div id="catalog-list" class="catalog-list"></div>
          <p id="tools-message" class="message"></p>
        </section>

        <section class="panel" id="site-view" hidden>
          <div class="page-head">
            <h2 data-i18n="siteTitle">站点</h2>
            <button type="button" data-home data-i18n="backHome">返回主页</button>
          </div>
          <form id="site-form">
            <label><span data-i18n="siteName">站点名称</span><input id="site-name"></label>
            <label><span data-i18n="siteLogo">Logo 地址（可选）</span><input id="site-logo" placeholder="https://..."></label>
            <p class="muted" data-i18n="siteLogoHint">不填则不显示 Logo。</p>
            <div class="actions">
              <button type="submit" class="primary" data-i18n="save">保存</button>
            </div>
          </form>
          <p id="site-message" class="message"></p>
        </section>

        <section class="panel" id="settings-view" hidden>
          <div class="page-head">
            <h2 data-i18n="settings">设置</h2>
            <button type="button" data-home data-i18n="backHome">返回主页</button>
          </div>
          <form id="settings-form">
            <label><span data-i18n="username">用户名</span><input id="setting-username"></label>
            <label><span data-i18n="deepseekKey">DeepSeek API Key</span><input id="setting-api-key" type="password" autocomplete="off" placeholder="sk-..."></label>
            <label><span data-i18n="fingerprint">本机软指纹</span><input id="setting-fingerprint" readonly></label>
            <div class="actions">
              <button type="submit" class="primary" data-i18n="save">保存</button>
              <button type="button" id="rotate-fingerprint" data-i18n="rotate">轮换软指纹</button>
            </div>
          </form>
          <p id="settings-message" class="message"></p>

          <section class="data-block">
            <h3 data-i18n="backupTitle">数据备份</h3>
            <p class="muted" data-i18n="backupHint">备份包含 items、附件和 App 数据，不包含 token、代码、venv。恢复必须填入一个不存在的新目录。</p>
            <div id="backup-list" class="backup-list"></div>
            <div class="backup-actions">
              <button type="button" id="backup-refresh" data-i18n="refresh">刷新</button>
              <button type="button" id="backup-create-settings" data-i18n="createBackup">创建备份</button>
            </div>
            <label><span data-i18n="restoreTarget">恢复到空目录</span><input id="backup-target" placeholder="/path/to/new-home"></label>
            <p id="backup-message" class="message"></p>
          </section>

        </section>

        <section class="panel" id="version-view" hidden>
          <div class="page-head">
            <h2 data-i18n="versionTitle">版本</h2>
            <button type="button" data-home data-i18n="backHome">返回主页</button>
          </div>
          <div class="version-hero">
            <div>
              <span class="muted" data-i18n="currentVersion">当前版本</span>
              <strong id="update-current">—</strong>
            </div>
            <div>
              <span class="muted" data-i18n="latestVersion">最新版本</span>
              <strong id="update-latest">—</strong>
            </div>
            <div>
              <span class="muted" data-i18n="updateStateLabel">状态</span>
              <strong id="update-state">—</strong>
            </div>
          </div>
          <p class="muted" data-i18n="versionHint">更新源由 Core 内置；检查后显示最新版本和更新状态。</p>
          <label><span data-i18n="updateMode">更新模式</span>
            <select id="update-mode">
              <option value="notify">notify · 只提示</option>
              <option value="download">download · 自动下载，手动安装</option>
            </select>
          </label>
          <label><span data-i18n="updateManifest">更新源（自动）</span><input id="update-manifest" readonly></label>
          <div class="actions">
            <button type="button" id="update-check" data-i18n="checkUpdate">检查更新</button>
            <button type="button" id="update-download" data-i18n="downloadUpdate">下载</button>
            <button type="button" id="update-install" class="primary" data-i18n="installUpdate">安装并重启</button>
            <button type="button" id="update-save" data-i18n="saveUpdate">保存设置</button>
          </div>
          <p id="update-message" class="message"></p>
          <section class="version-details">
            <p><span data-i18n="lastChecked">最近检查</span>: <span id="update-checked">—</span></p>
            <p><span data-i18n="updateJournal">安装阶段</span>: <span id="update-journal">—</span></p>
            <p><span data-i18n="updateSource">更新源</span>: <span id="update-source">—</span></p>
          </section>
        </section>
      </section>

      <aside class="detail-panel" id="detail-view">
        <p id="detail-empty" class="muted" data-i18n="selectItem">选择一条内容</p>
        <div id="detail"></div>
      </aside>
    </main>
  </div>

  <div id="gallery" class="gallery" hidden>
    <button id="gallery-close" class="gallery-close" aria-label="关闭">×</button>
    <button id="gallery-prev" class="gallery-nav gallery-prev" aria-label="上一张">‹</button>
    <img id="gallery-image" class="gallery-image" alt="">
    <button id="gallery-next" class="gallery-nav gallery-next" aria-label="下一张">›</button>
    <div id="gallery-count" class="gallery-count"></div>
  </div>

  <script src="/assets/vendor/katex/katex.min.js"></script>
  <script src="/assets/vendor/katex/auto-render.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
