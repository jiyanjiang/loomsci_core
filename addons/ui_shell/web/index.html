<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">loomsci ui-shell</title>
<link rel="stylesheet" href="/style.css?v=0.5.4">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
</head>
<body>
<header>
  <a class="brand" href="/"><img id="brand-logo" class="brand-logo" alt="" hidden><strong id="brand-name" data-i18n="app.name">loomsci</strong></a>
  <div id="site-links" class="site-links"></div>
  <span id="status" class="muted">connecting…</span>
  <nav>
    <button data-view="projects" data-i18n="nav.projects">Projects</button>
    <button data-view="posts" data-i18n="nav.posts">Posts</button>
    <button data-view="tasks" data-i18n="nav.tasks">Tasks</button>
    <button data-view="memory" data-i18n="nav.memory">Memory</button>
    <button data-view="inbox" data-i18n="nav.inbox">Inbox</button>
    <button data-view="site" data-i18n="nav.site">Site</button>
    <button data-view="settings" data-i18n="nav.settings">Settings</button>
  </nav>
  <select id="locale" aria-label="Language">
    <option value="en">EN</option>
    <option value="zh-CN">中文</option>
  </select>
</header>
<main id="app"><p class="muted">loading…</p></main>
<div id="error" class="error" hidden></div>
<footer id="site-footer" class="muted"></footer>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<script src="/i18n.js?v=0.5.4"></script>
<script src="/app.js?v=0.5.4"></script>
</body>
</html>
