<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>loomsci notify</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><strong>loomsci notify</strong><span id="status" class="muted"></span></header>
<div class="cards">
  <div class="card"><div id="unread" class="big">–</div><div class="muted">unread mentions</div></div>
  <div class="card"><div id="open-tasks" class="big">–</div><div class="muted">open tasks</div></div>
  <div class="card"><div id="posts" class="big">–</div><div class="muted">posts</div></div>
</div>
<div class="actions"><button id="refresh">Refresh</button><button id="read-all">Mark all read</button></div>
<div id="digest" class="md"></div>
<div id="error" class="error" hidden></div>
<script src="/app.js"></script>
</body>
</html>
